<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="IdéaMarket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#E059C9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEE9F6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#3B0A63" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="132" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- verre de l'ampoule (blanc) -->
    <path fill="url(#glass)" d="M256 104
      c-64 0 -114 48 -114 112
      0 42 22 74 48 96
      12 10 18 22 19 38
      l94 0
      c1 -16 7 -28 19 -38
      26 -22 48 -54 48 -96
      0 -64 -50 -112 -114 -112 z"/>
    <!-- filament violet (l'idée qui s'allume) -->
    <path fill="none" stroke="#A855F7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
      d="M222 214 l20 -34 14 30 14 -30 20 34"/>
    <path fill="none" stroke="#C77DFF" stroke-width="9" stroke-linecap="round"
      d="M242 210 v46 M270 210 v46"/>

    <!-- douille gris clair -->
    <rect x="209" y="348" width="94" height="20" rx="6" fill="#D6D6E0"/>
    <rect x="214" y="368" width="84" height="18" rx="5" fill="#C7C7D3"/>
    <rect x="221" y="386" width="70" height="18" rx="5" fill="#D6D6E0"/>
    <path d="M232 404 h48 l-10 22 q-14 8 -28 0 z" fill="#B9B9C6"/>
    <!-- rainures de la douille -->
    <line x1="214" y1="358" x2="298" y2="358" stroke="#B4B4C2" stroke-width="3"/>
    <line x1="221" y1="377" x2="291" y2="377" stroke="#ACACBB" stroke-width="3"/>
    <line x1="228" y1="395" x2="284" y2="395" stroke="#B4B4C2" stroke-width="3"/>
  </g>
</svg>
